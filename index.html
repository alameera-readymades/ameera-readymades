<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AL AMEERA Readymades</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #f1f3f6; }
    header { background: #2874f0; color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { margin: 0; font-size: 22px; }
    .search-box input { padding: 6px; width: 220px; border-radius: 4px; border: none; }
    nav { background: white; padding: 10px; display: flex; gap: 15px; overflow-x: auto; }
    nav a { text-decoration: none; color: #333; font-weight: bold; }
    .container { padding: 20px; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .card { background: white; padding: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 220px; object-fit: cover; border-radius: 4px; }
    .card h3 { margin: 10px 0 5px; font-size: 16px; }
    .price { color: green; font-weight: bold; }
    .card button { background: #ff9f00; border: none; padding: 8px; width: 100%; margin-top: 10px; cursor: pointer; border-radius: 4px; }
    footer { background: #172337; color: white; padding: 20px; text-align: center; margin-top: 40px; }
  </style>
</head>
<body>

<header>
  <h1>AL AMEERA Readymades</h1>
  <div class="search-box">
    <input type="text" placeholder="Search for products" />
  </div>
</header>

<!-- Floating WhatsApp Button -->
<a href="https://wa.me/91XXXXXXXXXX?text=Hello%20I%20want%20to%20order%20from%20your%20Readymade%20Store" class="whatsapp" target="_blank">WhatsApp Order</a>
<style>
.whatsapp{
 position:fixed; bottom:20px; right:20px;
 background:#25D366; color:white; padding:12px 16px;
 border-radius:50px; text-decoration:none; font-weight:bold;
 box-shadow:0 4px 8px rgba(0,0,0,0.3);
}
</style>

<nav>
  <a href="#">Men</a>
  <a href="#">Women</a>
  <a href="#">Kids</a>
  <a href="#">New Arrivals</a>
  <a href="#">Offers</a>
</nav>

<div class="container">
  <h2>Featured Products</h2>
  <div class="products">
    <div class="card">
      <img src="https://via.placeholder.com/300x400" />
      <h3>Men's T-Shirt</h3>
      <p class="price">₹499</p>
      <button>Add to Cart</button>
    </div>
    <div class="card">
      <img src="https://via.placeholder.com/300x400" />
      <h3>Women's Kurti</h3>
      <p class="price">₹899</p>
      <button>Add to Cart</button>
    </div>
    <div class="card">
      <img src="https://via.placeholder.com/300x400" />
      <h3>Kids Wear Set</h3>
      <p class="price">₹699</p>
      <button>Add to Cart</button>
    </div>
    <div class="card">
      <img src="https://via.placeholder.com/300x400" />
      <h3>Casual Shirt</h3>
      <p class="price">₹1,199</p>
      <button>Add to Cart</button>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 Readymade Store | Free Demo Website</p>
</footer>

</body>
</html>
